      border: 1px solid rgba(0, 242, 254, 0.35);
      border-radius: 12px;

      0% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0.7); }

      100% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0); }

    .scale-gradient.whitehot { background: linear-gradient(to right, #000000, #ffffff); }
    .scale-gradient.blackhot { background: linear-gradient(to right, #ffffff, #000000); }

    .split-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #00f2fe;
      cursor: ew-resize;
      z-index: 30;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.9);
    }
    .split-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
      background: #00f2fe;
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.9);
      user-select: none;
    }
    .hotspot-box {
      position: absolute;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      border: 2px dashed #ff5252;
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
    }
    .hotspot-ping {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(255, 82, 82, 0.35);
      animation: ping 1.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes ping {
      75%, 100% { transform: scale(1.6); opacity: 0; }
    }
    .spot-probe {
      position: absolute;
      display: none;
      pointer-events: none;
      transform: translate(-50%, -100%);
      z-index: 25;
    }
    .probe-val {
      background: rgba(0, 242, 254, 0.95);
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
      font-family: monospace;
    }

    .work-order-document {
      background: #ffffff;
      color: #0f172a;
      padding: 24px;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }
    .wo-header { display: flex; justify-content: space-between; border-bottom: 2px solid #0f172a; padding-bottom: 12px; margin-bottom: 16px; }
    .wo-logo { font-weight: 900; font-size: 18px; color: #0284c7; }
    .wo-alert-banner { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-weight: 700; }
    .wo-alert-banner.alert-critical { background: #fee2e2; color: #dc2626; border: 1px solid #ef4444; }
    .wo-alert-banner.alert-high_risk { background: #ffedd5; color: #c2410c; border: 1px solid #f97316; }
    .wo-alert-banner.alert-warning { background: #fef3c7; color: #b45309; border: 1px solid #f59e0b; }
    .wo-alert-banner.alert-normal { background: #dcfce7; color: #15803d; border: 1px solid #22c55e; }
    .wo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .wo-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .wo-table td { padding: 6px 8px; border-bottom: 1px solid #e2e8f0; }
    .wo-text-box, .wo-action-box { background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; margin-top: 6px; }
    .wo-signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 40px; padding-top: 20px; }
    .sig-line { border-bottom: 1px solid #000; height: 40px; margin-bottom: 6px; }
    .wo-footer { margin-top: 24px; text-align: center; font-size: 10px; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 8px; }

    @media print {
      body * { visibility: hidden; }
      .work-order-document, .work-order-document * { visibility: visible; }

    // FULLY ANIMATED & INTERACTIVE FACILITY MAP & CONTINUOUS PATROL DRONE FLIGHT SIMULATOR VIEW
    function FacilityMapView({ assets, selectedAsset, onSelectAsset, onNavigate, onSetDroneState }) {
      const canvasRef = useRef(null);
      const [flightState, setFlightState] = useState('NAVIGATING');
      const [isContinuousMode, setIsContinuousMode] = useState(true);
      const [lapCount, setLapCount] = useState(1);
      const [dronePos, setDronePos] = useState({ x: 120, y: 100, angle: 0 });
      const [targetIndex, setTargetIndex] = useState(0);
      const [altitude, setAltitude] = useState(15.2);
      const [speed, setSpeed] = useState(3.8);
      const [speedMult, setSpeedMult] = useState(1);
      const [gimbalPitch, setGimbalPitch] = useState(-30);
      const [scanProgress, setScanProgress] = useState(0);

      const helipad = { x: 100, y: 80 };
      const sortedAssets = useMemo(() => [...assets].sort((a, b) => a.waypointIndex - b.waypointIndex), [assets]);

      useEffect(() => {
        if (onSetDroneState) {
          if (flightState === 'SCANNING' || flightState === 'NAVIGATING') {
            onSetDroneState(`SCANNING (LAP ${lapCount})`);
          } else {
            onSetDroneState(flightState);
          }
        }
      }, [flightState, lapCount, onSetDroneState]);

      useEffect(() => {
        if (!canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.clientWidth || 800;
        canvas.height = 460;

        const w = canvas.width;
        const h = canvas.height;
        const sx = w / 800;
        const sy = h / 460;

        let animationId;
        let lastTime = Date.now();
        let rotorAngle = 0;

        const loop = () => {
          const now = Date.now();
          const dt = Math.min((now - lastTime) / 1000, 0.1) * speedMult;
          lastTime = now;

          if (flightState !== 'PAUSED' && flightState !== 'IDLE') {
            rotorAngle += 0.4 * speedMult;
          }

          if (flightState === 'NAVIGATING') {
            const targetAsset = sortedAssets[targetIndex];
            if (targetAsset) {
              const tx = targetAsset.mapCoords.x;
              const ty = targetAsset.mapCoords.y;

              const dx = tx - dronePos.x;
              const dy = ty - dronePos.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              const angle = Math.atan2(dy, dx) * 180 / Math.PI;
              const moveStep = 80 * dt;

              if (dist <= moveStep) {
                setDronePos({ x: tx, y: ty, angle });
                setFlightState('SCANNING');
                setScanProgress(0);
                setGimbalPitch(-45);
                onSelectAsset(targetAsset);
              } else {
                setDronePos(prev => ({
                  x: prev.x + (dx / dist) * moveStep,
                  y: prev.y + (dy / dist) * moveStep,
                  angle
                }));
                setSpeed(4.2 * speedMult);
                setAltitude(15.2);
                setGimbalPitch(-15);
              }
            }
          } else if (flightState === 'SCANNING') {
            setSpeed(0);
            setScanProgress(p => {
              const np = p + dt * 0.5;
              if (np >= 1.0) {
                const isLastAsset = targetIndex === sortedAssets.length - 1;

                if (isLastAsset) {
                  if (isContinuousMode) {
                    setTargetIndex(0);
                    setLapCount(l => l + 1);
                    setFlightState('NAVIGATING');
                  } else {
                    setFlightState('RTH');
                  }
                } else {
                  setTargetIndex(targetIndex + 1);
                  setFlightState('NAVIGATING');
                }
                return 0;
              }
              return np;
            });
          } else if (flightState === 'RTH') {
            const dx = helipad.x - dronePos.x;
            const dy = helipad.y - dronePos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
            const moveStep = 100 * dt;

            if (dist <= moveStep) {
              setDronePos({ x: helipad.x, y: helipad.y, angle: 0 });
              setFlightState('IDLE');
              setSpeed(0);
              setAltitude(0);
            } else {
              setDronePos(prev => ({
                x: prev.x + (dx / dist) * moveStep,
                y: prev.y + (dy / dist) * moveStep,
                angle
              }));
              setSpeed(5.0 * speedMult);
            }
          }

          ctx.fillStyle = '#060911';
          ctx.fillRect(0, 0, w, h);

          ctx.strokeStyle = 'rgba(0, 242, 254, 0.05)';
          ctx.lineWidth = 1;
          for (let x = 0; x < w; x += 40 * sx) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
          }
          for (let y = 0; y < h; y += 40 * sy) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
          }

          ctx.fillStyle = 'rgba(0, 242, 254, 0.03)';
          ctx.strokeStyle = 'rgba(0, 242, 254, 0.2)';
          ctx.fillRect(40 * sx, 40 * sy, 350 * sx, 200 * sy);
          ctx.strokeRect(40 * sx, 40 * sy, 350 * sx, 200 * sy);
          ctx.fillStyle = 'rgba(0, 242, 254, 0.4)';
          ctx.font = 'bold 9px "JetBrains Mono", monospace';
          ctx.fillText('ZONE A: TRANSFORMER YARD', 50 * sx, 56 * sy);

          ctx.fillStyle = 'rgba(255, 171, 0, 0.03)';
          ctx.strokeStyle = 'rgba(255, 171, 0, 0.2)';
          ctx.fillRect(420 * sx, 40 * sy, 340 * sx, 160 * sy);
          ctx.strokeRect(420 * sx, 40 * sy, 340 * sx, 160 * sy);

          ctx.fillStyle = 'rgba(0, 230, 118, 0.03)';
          ctx.strokeStyle = 'rgba(0, 230, 118, 0.2)';
          ctx.fillRect(600 * sx, 220 * sy, 160 * sx, 210 * sy);
          ctx.strokeRect(600 * sx, 220 * sy, 160 * sx, 210 * sy);

          ctx.strokeStyle = 'rgba(0, 242, 254, 0.4)';
          ctx.lineWidth = 2 * sx;
          ctx.setLineDash([6 * sx, 6 * sx]);
          ctx.beginPath();
          ctx.moveTo(helipad.x * sx, helipad.y * sy);
          sortedAssets.forEach(asset => {
            ctx.lineTo(asset.mapCoords.x * sx, asset.mapCoords.y * sy);
          });
          if (isContinuousMode && sortedAssets.length > 0) {
            ctx.lineTo(sortedAssets[0].mapCoords.x * sx, sortedAssets[0].mapCoords.y * sy);
          } else {
            ctx.lineTo(helipad.x * sx, helipad.y * sy);
          }
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.fillStyle = 'rgba(0, 242, 254, 0.12)';
          ctx.strokeStyle = '#00f2fe';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(helipad.x * sx, helipad.y * sy, 20 * sx, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#00f2fe';
          ctx.font = 'bold 12px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('H', helipad.x * sx, helipad.y * sy + 4 * sy);

          sortedAssets.forEach((asset, idx) => {
            const ax = asset.mapCoords.x * sx;
            const ay = asset.mapCoords.y * sy;
            const isTarget = idx === targetIndex && (flightState === 'NAVIGATING' || flightState === 'SCANNING');
            const isSelected = selectedAsset && asset.id === selectedAsset.id;

            const color = asset.status === 'critical' ? '#ff5252' : asset.status === 'warning' || asset.status === 'high_risk' ? '#ffab00' : '#00e676';

            if (isTarget || isSelected) {
              const pulse = (Math.sin(now / 200) + 1) / 2;
              ctx.fillStyle = color;
              ctx.globalAlpha = 0.2 + pulse * 0.3;
              ctx.beginPath();
              ctx.arc(ax, ay, (22 + pulse * 10) * sx, 0, Math.PI * 2);
              ctx.fill();
              ctx.globalAlpha = 1.0;
            }

            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = (isTarget || isSelected) ? 16 : 6;
            ctx.beginPath();
            ctx.arc(ax, ay, 13 * sx, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`WP${asset.waypointIndex}`, ax, ay + 3.5 * sy);

            ctx.fillStyle = isSelected ? '#ffffff' : 'rgba(255, 255, 255, 0.85)';
            ctx.font = 'bold 11px "JetBrains Mono", monospace';
            ctx.fillText(asset.id, ax, ay - 16 * sy);

            ctx.fillStyle = color;
            ctx.font = 'bold 10px monospace';
            ctx.fillText(`${asset.currentScanTemp.toFixed(1)}°C`, ax, ay + 24 * sy);
          });

          const dx = dronePos.x * sx;
          const dy = dronePos.y * sy;

          ctx.save();
          ctx.translate(dx, dy);
          ctx.rotate((dronePos.angle || 0) * Math.PI / 180);

          const fovGrad = ctx.createRadialGradient(0, 0, 4 * sx, 0, 0, 65 * sx);
          fovGrad.addColorStop(0, 'rgba(0, 242, 254, 0.4)');
          fovGrad.addColorStop(1, 'rgba(0, 242, 254, 0)');
          ctx.fillStyle = fovGrad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, 65 * sx, -Math.PI / 4, Math.PI / 4);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#00f2fe';
          ctx.lineWidth = 2.5 * sx;
          ctx.beginPath();
          ctx.moveTo(-12 * sx, -12 * sy); ctx.lineTo(12 * sx, 12 * sy);
          ctx.moveTo(-12 * sx, 12 * sy); ctx.lineTo(12 * sx, -12 * sy);
          ctx.stroke();

          [[-12, -12], [12, -12], [-12, 12], [12, 12]].forEach(([rx, ry]) => {
            ctx.save();
            ctx.translate(rx * sx, ry * sy);
            ctx.rotate(rotorAngle);
            ctx.strokeStyle = 'rgba(0, 242, 254, 0.8)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, 7 * sx, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          });

          ctx.fillStyle = '#00f2fe';
          ctx.beginPath();
          ctx.arc(0, 0, 6 * sx, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ff5252';
          ctx.beginPath();
          ctx.arc(7 * sx, 0, 3 * sx, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();

          animationId = requestAnimationFrame(loop);
        };

        loop();
        return () => cancelAnimationFrame(animationId);
      }, [dronePos, flightState, targetIndex, sortedAssets, speedMult, selectedAsset, isContinuousMode]);

      const handleCanvasClick = (e) => {
        if (!canvasRef.current) return;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
        const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        const sx = canvas.width / 800;
        const sy = canvas.height / 460;

        sortedAssets.forEach((asset, idx) => {
          const ax = asset.mapCoords.x * sx;
          const ay = asset.mapCoords.y * sy;
          const dist = Math.sqrt(Math.pow(mouseX - ax, 2) + Math.pow(mouseY - ay, 2));

          if (dist < 26) {
            onSelectAsset(asset);
            setTargetIndex(idx);
            setFlightState('NAVIGATING');
          }
        });
      };

      const currentTargetAsset = sortedAssets[targetIndex] || sortedAssets[0];

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 h-full">
          <div className="lg:col-span-2 glass-panel p-4 flex flex-col h-[520px]">
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
                <h3 className="text-xs font-bold tracking-wider text-slate-200 uppercase">SUBSTATION BAY ALPHA LIVE FLIGHT MAP</h3>
              </div>
              <div className="flex items-center gap-3 text-[10px]">
                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-emerald-400"></span> Normal</span>
                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-amber-400"></span> Warning</span>
                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-orange-400"></span> High Risk</span>
                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-red-400"></span> Critical</span>

    // FULLY INTERACTIVE DUAL SLIDER FLIR THERMAL INSPECTOR VIEW
    function ThermalInspectorView({ asset }) {
      const [palette, setPalette] = useState('rainbow');
      const [splitRatio, setSplitRatio] = useState(50);
      const [isDragging, setIsDragging] = useState(false);
      const [spotTemp, setSpotTemp] = useState(null);
      const [probePos, setProbePos] = useState({ x: 0, y: 0 });

      const viewportRef = useRef(null);
      const rgbCanvasRef = useRef(null);
      const thermalCanvasRef = useRef(null);

      useEffect(() => {
        if (!asset || !thermalCanvasRef.current || !rgbCanvasRef.current) return;

        let animationFrameId;
        let tick = 0;

        const rgbCtx = rgbCanvasRef.current.getContext('2d');
        rgbCtx.fillStyle = '#1e293b';
        rgbCtx.fillRect(0, 0, 640, 380);
        rgbCtx.fillStyle = '#0f172a';
        rgbCtx.fillRect(60, 40, 520, 300);
        rgbCtx.fillStyle = '#94a3b8';
        rgbCtx.font = 'bold 14px "JetBrains Mono", monospace';
        rgbCtx.textAlign = 'center';
        rgbCtx.fillText('PHASE A', 160, 80);
        rgbCtx.fillText('PHASE B', 320, 80);
        rgbCtx.fillText('PHASE C', 455, 80);

        [160, 320, 455].forEach(cx => {
          rgbCtx.fillStyle = '#475569';
          rgbCtx.fillRect(cx - 20, 100, 40, 160);
          rgbCtx.fillStyle = '#b45309';
          rgbCtx.beginPath();
          rgbCtx.arc(cx, 180, 14, 0, Math.PI * 2);
          rgbCtx.fill();
        });

        const thermalCtx = thermalCanvasRef.current.getContext('2d');

        const renderFrame = () => {
          tick += 0.05;
          const imgData = thermalCtx.createImageData(640, 380);
          const data = imgData.data;

          const hsX = (asset.hotspotPos.x / 100) * 640;
          const hsY = (asset.hotspotPos.y / 100) * 380;
          const noise = Math.sin(tick) * 1.5;

          for (let y = 0; y < 380; y++) {
            for (let x = 0; x < 640; x++) {
              let temp = asset.ambientTemp + 5 + Math.sin(x / 30 + tick) * 0.5;
              const dist = Math.sqrt(Math.pow(x - hsX, 2) + Math.pow(y - hsY, 2));
              if (dist < 130 && asset.status !== 'normal') {
                temp += (asset.currentScanTemp + noise - temp) * Math.pow(1 - dist / 130, 2);
              }

              const t = Math.max(0, Math.min(1, (temp - 20) / 90));
              const idx = (y * 640 + x) * 4;

              if (palette === 'whitehot') {
                const v = Math.round(t * 255);
                data[idx] = v; data[idx + 1] = v; data[idx + 2] = v;
              } else if (palette === 'blackhot') {
                const v = Math.round((1 - t) * 255);
                data[idx] = v; data[idx + 1] = v; data[idx + 2] = v;
              } else if (palette === 'rainbow') {
                let r = 0, g = 0, b = 0;
                if (t < 0.2) { b = Math.round(t / 0.2 * 255); }
                else if (t < 0.4) { b = 255; g = Math.round((t - 0.2) / 0.2 * 255); }
                else if (t < 0.6) { g = 255; b = Math.round((0.6 - t) / 0.2 * 255); }
                else if (t < 0.8) { g = 255; r = Math.round((t - 0.6) / 0.2 * 255); }
                else if (t < 0.95) { r = 255; g = Math.round((0.95 - t) / 0.15 * 255); }
                else { r = 255; g = 255; b = Math.round((t - 0.95) / 0.05 * 255); }
                data[idx] = r; data[idx + 1] = g; data[idx + 2] = b;
              } else {
                let r = 0, g = 0, b = 0;
                if (t < 0.25) { r = Math.round(t / 0.25 * 80); b = Math.round(t / 0.25 * 160); }
                else if (t < 0.5) { const p = (t - 0.25) / 0.25; r = Math.round(80 + p * 120); g = Math.round(p * 40); b = Math.round(160 - p * 120); }
                else if (t < 0.75) { const p = (t - 0.5) / 0.25; r = Math.round(200 + p * 55); g = Math.round(40 + p * 160); b = 20; }
                else { const p = (t - 0.75) / 0.25; r = 255; g = Math.round(200 + p * 55); b = Math.round(20 + p * 235); }
                data[idx] = r; data[idx + 1] = g; data[idx + 2] = b;
              }
              data[idx + 3] = 255;
            }
          }
          thermalCtx.putImageData(imgData, 0, 0);
          animationFrameId = requestAnimationFrame(renderFrame);
        };

        renderFrame();
        return () => cancelAnimationFrame(animationFrameId);
      }, [asset, palette]);

      const updateRatioFromX = (clientX) => {
        if (!viewportRef.current) return;
        const rect = viewportRef.current.getBoundingClientRect();
        let ratio = ((clientX - rect.left) / rect.width) * 100;
        ratio = Math.max(0, Math.min(100, ratio));
        setSplitRatio(ratio);
      };

      const handleMouseDown = (e) => {
        setIsDragging(true);
        updateRatioFromX(e.clientX);
      };

      const handleMouseMove = (e) => {
        if (isDragging) {
          updateRatioFromX(e.clientX);
        }

        if (viewportRef.current && asset) {
          const rect = viewportRef.current.getBoundingClientRect();
          const rx = (e.clientX - rect.left) / rect.width;
          const ry = (e.clientY - rect.top) / rect.height;
          setProbePos({ x: rx * 100, y: ry * 100 });

          const hsX = asset.hotspotPos.x / 100;
          const hsY = asset.hotspotPos.y / 100;
          const dist = Math.sqrt(Math.pow(rx - hsX, 2) + Math.pow(ry - hsY, 2));

          let temp = asset.ambientTemp + 5;
          if (dist < 0.35) {
            temp += (asset.currentScanTemp - (asset.ambientTemp + 5)) * Math.pow(1 - dist / 0.35, 2);
          }
          setSpotTemp(temp.toFixed(1));
        }
      };

      if (!asset) return null;

      return (
        <div className="glass-panel p-4 flex flex-col gap-4">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></span>
              <h3 className="font-mono text-sm font-bold text-cyan-400">{asset.id} - {asset.name.toUpperCase()}</h3>
              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/20 text-red-400 border border-red-500">{asset.status.toUpperCase()}</span>
            </div>

            <div className="flex items-center gap-2 text-xs">
              <label className="text-slate-400 font-bold">FLIR PALETTE:</label>
              <select value={palette} onChange={(e) => setPalette(e.target.value)} className="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded px-2.5 py-1.5 font-bold">
                <option value="ironbow">FLIR Ironbow</option>
                <option value="rainbow">Thermal Rainbow</option>
                <option value="whitehot">White-Hot</option>
                <option value="blackhot">Black-Hot</option>
              </select>
            </div>
          </div>

          <div className="flex flex-col items-center gap-3">
            <div
              ref={viewportRef}
              onMouseDown={handleMouseDown}
              onMouseMove={handleMouseMove}
              onMouseUp={() => setIsDragging(false)}
              onMouseLeave={() => { setIsDragging(false); setSpotTemp(null); }}
              onTouchStart={(e) => { setIsDragging(true); updateRatioFromX(e.touches[0].clientX); }}
              onTouchMove={(e) => { if (isDragging) updateRatioFromX(e.touches[0].clientX); }}
              onTouchEnd={() => setIsDragging(false)}
              className="relative w-[640px] h-[380px] rounded-lg overflow-hidden border-2 border-slate-700 cursor-ew-resize select-none shadow-2xl"
            >
              <canvas ref={rgbCanvasRef} width="640" height="380" className="absolute top-0 left-0"></canvas>
              <canvas
                ref={thermalCanvasRef}
                width="640"
                height="380"
                className="absolute top-0 left-0"
                style={{ clipPath: `inset(0 0 0 ${splitRatio}%)` }}
              ></canvas>

              <div className="split-handle" style={{ left: `${splitRatio}%` }}>
                <div className="split-knob">↔</div>
              </div>

              {asset.status !== 'normal' && (
                <div className="hotspot-box" style={{ left: `${asset.hotspotPos.x}%`, top: `${asset.hotspotPos.y}%` }}>
                  <div className="hotspot-ping"></div>
                  <div className="absolute -top-7 left-1/2 -translate-x-1/2 whitespace-nowrap bg-red-600 text-white px-2 py-0.5 rounded text-[9px] font-bold shadow-lg">
                    LIVE HOTSPOT: {asset.currentScanTemp.toFixed(1)} °C
                  </div>
                </div>
              )}

              {spotTemp && (
                <div className="spot-probe" style={{ display: 'block', left: `${probePos.x}%`, top: `${probePos.y}%` }}>
                  <div className="probe-val">{spotTemp} °C</div>
                </div>
              )}
            </div>

            <div className="flex items-center gap-3 w-[640px] text-xs font-bold">
              <span className="text-slate-400">20.0 °C</span>
              <div className={`flex-1 h-3 rounded scale-gradient ${palette}`}></div>
              <span className="text-slate-400">{(asset.currentScanTemp + 10).toFixed(1)} °C</span>
            </div>
          </div>

          <div className="bg-slate-950/80 p-4 rounded-xl text-xs space-y-3 w-[640px] mx-auto border border-slate-800">
            <div className="flex items-center justify-between">
              <span className="text-slate-300 font-bold flex items-center gap-2">
                <span>🎚️ RGB Optical / FLIR Thermal Overlay Split:</span>
                <span className="text-cyan-400 font-extrabold font-mono text-sm">{Math.round(splitRatio)}%</span>
              </span>
              <div className="flex gap-2">
                <button onClick={() => setSplitRatio(0)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded text-[10px] font-bold">0% (RGB Only)</button>
                <button onClick={() => setSplitRatio(50)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded text-[10px] font-bold">50% Split</button>
                <button onClick={() => setSplitRatio(100)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded text-[10px] font-bold">100% (Thermal Only)</button>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <span className="text-[10px] text-slate-400 font-mono font-bold">RGB Optical</span>
              <input
                type="range"
                min="0"
                max="100"
                value={splitRatio}
                onChange={(e) => setSplitRatio(parseFloat(e.target.value))}
                className="w-full accent-cyan-400 h-2 bg-slate-800 rounded-lg cursor-pointer"
              />
              <span className="text-[10px] text-cyan-400 font-mono font-bold">FLIR Thermal</span>
            </div>
          </div>
        </div>
      );
    }

      return (
        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6 h-full">
          <div className="glass-panel p-4 flex flex-col space-y-3">
            <h3 className="text-xs font-bold tracking-wider text-slate-200 uppercase">Electrical Maintenance Orders</h3>
            <div className="flex-1 overflow-y-auto space-y-2">
              {assets.map(asset => (
                <button
                  key={asset.id}
                  onClick={() => onSelectAsset(asset)}
                  className={`w-full p-3 rounded-lg text-left transition-all border ${
                    asset.id === selectedAsset.id
                      ? 'bg-cyan-500/15 border-cyan-500 text-cyan-400 font-bold'
                      : 'bg-slate-950/40 border-slate-800 text-slate-300 hover:bg-slate-900'
                  }`}
                >
                  <div className="font-mono text-xs font-bold">{asset.id}</div>
                  <div className="text-[10px] text-slate-400 truncate">{asset.name}</div>
                </button>
              ))}
            </div>
          </div>

          <div className="lg:col-span-3 glass-panel p-4 flex flex-col space-y-4 overflow-y-auto h-[540px]">
            <div className="flex justify-between items-center">
              <h3 className="text-xs font-bold tracking-wider text-slate-200 uppercase">Official NETA MTS-2023 Electrical Work Order</h3>
              <button onClick={handlePrint} className="bg-cyan-500 text-slate-950 font-bold text-xs px-4 py-2 rounded-lg">
                🖨️ PRINT / EXPORT PDF REPORT
              </button>
            </div>

            {selectedAsset && (
              <div className="work-order-document">
                <div className="wo-header">
                  <div className="wo-brand">
                    <span className="wo-logo">🚁 THERMOSENTINEL AI</span>
                    <div style={{ fontSize: '10px', color: '#64748b' }}>Standards: NETA MTS-2023 / IEEE C57.12.00</div>
                  </div>
                  <div>WO-2026-{selectedAsset.id}-09</div>
                </div>
                <div className={`wo-alert-banner alert-${selectedAsset.status}`}>
                  SEVERITY: {selectedAsset.status.toUpperCase()} - {selectedAsset.name} ({selectedAsset.standard})
                </div>
                <div className="wo-grid">
                  <div>
                    <h4>REAL THERMAL METRICS</h4>
                    <table className="wo-table">
                      <tbody>
                        <tr><td>Reference Temp:</td><td>{selectedAsset.referenceTemp} °C</td></tr>
                        <tr><td>Scan Max Temp:</td><td><strong>{selectedAsset.currentScanTemp.toFixed(1)} °C</strong></td></tr>
                        <tr><td>Delta T (ΔT Anomaly):</td><td><strong>+{deltaT} °C</strong></td></tr>
                        <tr><td>Operating Load:</td><td>{selectedAsset.loadPercentage}% ({selectedAsset.actualCurrent}A / {selectedAsset.ratedCurrent}A)</td></tr>
                        <tr><td>Specific Hotspot:</td><td>{selectedAsset.hotspotTarget}</td></tr>
                      </tbody>
                    </table>
                  </div>
                  <div>
                    <h4>AI ROOT CAUSE DIAGNOSIS</h4>
                    <div className="wo-text-box">{selectedAsset.diagnosis}</div>
                  </div>
                </div>
                <div style={{ marginTop: '16px' }}>
                  <h4>RECOMMENDED CORRECTIVE ACTION</h4>
                  <div className="wo-action-box">{selectedAsset.recommendedAction}</div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // MAIN REACT APP
    function App() {
      const [assets, setAssets] = useState(INITIAL_ASSETS);
      const [selectedAsset, setSelectedAsset] = useState(INITIAL_ASSETS[0]);
      const [currentView, setCurrentView] = useState('dashboard');
      const [droneState, setDroneState] = useState('SCANNING (CONTINUOUS)');
      const [battery, setBattery] = useState(94.0);
      const [telemetryPackets, setTelemetryPackets] = useState([]);

      useEffect(() => {
        const timer = setInterval(() => {
          setAssets(prev => prev.map(a => {
            const jitter = (Math.random() - 0.5) * 0.4;
            const newTemp = Math.max(a.referenceTemp, a.currentScanTemp + jitter);
            return { ...a, currentScanTemp: newTemp };
          }));

          setBattery(b => Math.max(10, b - 0.01));

          const now = new Date();
          const pad = (n) => String(n).padStart(2, '0');
          const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}.${Math.floor(now.getMilliseconds() / 100)}`;
          
          const randomAsset = INITIAL_ASSETS[Math.floor(Math.random() * INITIAL_ASSETS.length)];
          const pkt = {
            timestamp: timeStr,
            assetId: randomAsset.id,
            sensorId: Math.floor(100 + Math.random() * 900),
            temp: randomAsset.currentScanTemp + (Math.random() - 0.5) * 0.6,
            current: randomAsset.actualCurrent,
            deltaT: randomAsset.currentScanTemp - randomAsset.referenceTemp,
            checksum: '0x' + Math.floor(Math.random() * 65535).toString(16).toUpperCase()
          };

          setTelemetryPackets(pkts => [pkt, ...pkts.slice(0, 50)]);
        }, 800);

        return () => clearInterval(timer);
      }, []);

      return (
        <div className="flex flex-col h-screen overflow-hidden">
          <Navbar
            droneState={droneState}
            battery={battery}
            onStartMission={() => setCurrentView('map')}
          />

          <div className="flex flex-1 p-3 gap-3 overflow-hidden">
            <Sidebar currentView={currentView} onViewChange={setCurrentView} />

            <main className="flex-1 overflow-y-auto">
              {currentView === 'dashboard' && (
                <DashboardView assets={assets} onSelectAsset={setSelectedAsset} onNavigate={setCurrentView} />
              )}
              {currentView === 'map' && (
                <FacilityMapView
                  assets={assets}
                  selectedAsset={selectedAsset}
                  onSelectAsset={setSelectedAsset}
                  onNavigate={setCurrentView}
                  onSetDroneState={setDroneState}
                />
              )}
              {currentView === 'inspector' && (
                <ThermalInspectorView asset={selectedAsset} />
              )}
              {currentView === 'stream' && (
                <TelemetryStreamView packets={telemetryPackets} />
              )}
              {currentView === 'analytics' && (
                <AITrendsView asset={selectedAsset} />
              )}
              {currentView === 'reports' && (
                <WorkOrdersView assets={assets} selectedAsset={selectedAsset} onSelectAsset={setSelectedAsset} />
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
